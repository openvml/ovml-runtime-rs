[package]
name = "ovml-runtime"
version = "0.1.1"
edition = "2021"
description = "Cross-platform device-side TTS runtime for OpenVML Studio"
license = "Apache-2.0"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
tract-onnx = "0.21"
hound = "3"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
thiserror = "1"
async-stream = "0.3"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
ureq = { version = "2", features = ["json"] }
piper-rs = "0.2"
kothok-edge-tts = "0.2.10"
ort = { version = "=2.0.0-rc.12", features = ["load-dynamic"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ovml-runtime"
path = "src/main.rs"

[patch.crates-io]
kothok-edge-tts = { path = "vendor/kothok-edge-tts" }
